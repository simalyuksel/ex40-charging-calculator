<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volvo EX40 Şarj Hesaplayıcı</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #e2e8f0;
      color: #1e293b;
      margin: 0;
      padding: 26px;
    }
    .container {
      max-width: 540px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.96);
      padding: 32px;
      border-radius: 28px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }
    .logo-box {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      background: #0f172a;
      display: grid;
      place-items: center;
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.16);
      overflow: hidden;
    }
    .logo-box img {
      width: 42px;
      height: auto;
      object-fit: contain;
      display: block;
    }
    h1 {
      margin: 0;
      color: #0f172a;
      font-size: 1.55rem;
      line-height: 1.2;
    }
    @media (max-width: 600px) {
      body {
        padding: 16px;
      }
      .container {
        padding: 22px;
      }
      .header {
        flex-wrap: wrap;
        align-items: flex-start;
      }
      .logo-box {
        width: 48px;
        height: 48px;
      }
      h1 {
        font-size: 1.35rem;
      }
      .radio-group {
        flex-direction: column;
        gap: 12px;
      }
      button {
        padding: 14px;
      }
    }
    label {
      display: block;
      margin: 15px 0 5px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    input[type="number"] {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      font-size: 1rem;
      box-sizing: border-box;
      background: #f8fafc;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
      background: #ffffff;
    }
    .radio-group {
      display: flex;
      gap: 20px;
      margin: 10px 0;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-weight: normal;
      cursor: pointer;
    }
    button {
      margin-top: 25px;
      width: 100%;
      border: none;
      background: #2563eb;
      color: white;
      padding: 16px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.18);
    }
    button:hover {
      transform: translateY(-1px);
      background: #1d4ed8;
      box-shadow: 0 16px 32px rgba(37, 99, 235, 0.22);
    }
    .result {
      margin-top: 25px;
      padding: 20px;
      background: #f8fafc;
      border-radius: 12px;
      border-left: 5px solid #10b981;
    }
    .warning {
      color: #b91c1c;
      font-size: 0.85rem;
      margin-top: 5px;
      font-style: italic;
    }
    .note {
      margin-top: 20px;
      color: #64748b;
      font-size: 0.85rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo-box">
        <img src="ex40.png" alt="Volvo EX40">
      </div>
      <div>
        <h1>Volvo EX40 Şarj Hesaplayıcı</h1>
        <p style="font-size: 0.92rem; color: #64748b; margin: 6px 0 0;">79 kWh batarya ve gerçek saha verileri baz alınmıştır.</p>
      </div>
    </div>

    <label for="currentSoc">Mevcut Şarj Seviyesi (%)</label>
    <input id="currentSoc" type="number" min="0" max="100" value="20">

    <label for="targetSoc">Hedef Şarj Seviyesi (%)</label>
    <input id="targetSoc" type="number" min="0" max="100" value="80">

    <label>Elektrik Bağlantı Tipi</label>
    <div class="radio-group">
      <label><input type="radio" name="phase" value="1"> Tek Faz (Ev Prizi)</label>
      <label><input type="radio" name="phase" value="3" checked> 3 Faz (Wallbox)</label>
    </div>

    <label for="amperage">Amper Ayarı (Araçtan seçilen)</label>
    <input id="amperage" type="number" min="6" max="32" value="16">

    <button id="calculate">Hesapla</button>

    <div class="result" id="result" style="display:none;"></div>

    <div class="note">
      <strong>Not:</strong> 3 fazlı şarjda yük altı şebeke gerilimi (~225V), %4.3 ortalama iletken kaybı ve %80 üzeri hücre dengeleme süreleri dahil edilmiştir.
    </div>
  </div>

  <script>
    const capacityKwh = 79;
    const efficiency = 0.957; // %4.3 ortalama şarj kaybı

    function formatTime(totalHours) {
      const hours = Math.floor(totalHours);
      const minutes = Math.round((totalHours - hours) * 60);
      return `${hours} saat ${minutes} dakika`;
    }

    function formatClock(date) {
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${hours}:${minutes}`;
    }

    function calculateCharge() {
      const currentSoc = Number(document.getElementById('currentSoc').value);
      const targetSoc = Number(document.getElementById('targetSoc').value);
      const amperage = Number(document.getElementById('amperage').value);
      const phase = document.querySelector('input[name="phase"]:checked').value;
      const resultEl = document.getElementById('result');

      if (targetSoc <= currentSoc) {
        resultEl.innerHTML = '<span style="color:red;">Hedef, mevcut şarjdan yüksek olmalı!</span>';
        resultEl.style.display = 'block';
        return;
      }

      // Yük altındaki gerçekçi ortalama faz gerilimi (Voltaj düşümü dahil)
      const voltagePerPhase = 225; 
      
      let rawPowerKw = 0;
      if (phase === '1') {
        rawPowerKw = (voltagePerPhase * amperage) / 1000;
      } else {
        // 3 Faz: 3 x V x I
        rawPowerKw = (3 * voltagePerPhase * amperage) / 1000;
      }

      let warningMsg = "";
      // Volvo EX40 Maksimum AC Sınırı: 11 kW
      if (rawPowerKw > 11) {
        rawPowerKw = 11;
        warningMsg = "<div class='warning'>* Seçilen amper 11 kW limitini aşıyor, araç maksimum 11 kW ile sınırlandırıldı.</div>";
      }

      // Bataryaya giren net güç
      const netPowerKw = rawPowerKw * efficiency;

      // Parçalı zaman hesabı
      let totalHours = 0;
      
      // %0 - %80 Arası (Ana Dolum)
      if (currentSoc < 80) {
        let endPoint = Math.min(targetSoc, 80);
        let energyNeeded = capacityKwh * (endPoint - currentSoc) / 100;
        totalHours += energyNeeded / netPowerKw;
      }

      // %80 - %90 Arası (Hız Düşümü / Tapering)
      if (targetSoc > 80) {
        let startPoint = Math.max(currentSoc, 80);
        let endPoint = Math.min(targetSoc, 90);
        if (startPoint < endPoint) {
          let energyNeeded = capacityKwh * (endPoint - startPoint) / 100;
          // Eğer çekilen güç 7 kW üstüyse 7 kW'a sınırla; 6A gibi düşük güçlerde (3.88 kW) hızı düşürme
          let taperedNetPower = Math.min(netPowerKw, 7 * efficiency);
          totalHours += energyNeeded / taperedNetPower;
        }
      }

      // %90 - %100 Arası (Hücre Dengeleme)
      if (targetSoc > 90) {
        let startPoint = Math.max(currentSoc, 90);
        let energyNeeded = capacityKwh * (targetSoc - startPoint) / 100;
        // Dengeleme aşamasında güç ~3.5 kW seviyesine iner
        let trickleNetPower = Math.min(netPowerKw, 3.5 * efficiency);
        totalHours += (energyNeeded / trickleNetPower) + 0.25; // Sabit +15 dk hücre dengeleme payı
      }

      const totalEnergyGross = (capacityKwh * (targetSoc - currentSoc) / 100) / efficiency;
      const finishDate = new Date();
      finishDate.setMinutes(finishDate.getMinutes() + Math.round(totalHours * 60));

      resultEl.innerHTML = `
        <p><strong>Çekilen Brüt Güç:</strong> ${rawPowerKw.toFixed(2)} kW (${phase === '1' ? 'Tek Faz' : '3 Faz - ' + amperage + 'A'}) ${warningMsg}</p>
        <p><strong>Net Şarj Hızı:</strong> ${netPowerKw.toFixed(2)} kW</p>
        <p><strong>Prizden Çekilecek Enerji:</strong> ${totalEnergyGross.toFixed(2)} kWh</p>
        <p style="font-size:1.2rem; color:#10b981; margin-top:12px;"><strong>Tahmini Süre:</strong> <br>${formatTime(totalHours)}</p>
        <p style="margin-top:8px;"><strong>Tahmini Bitiş Saati:</strong> ${formatClock(finishDate)}</p>
      `;
      resultEl.style.display = 'block';
      resultEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    document.getElementById('calculate').addEventListener('click', calculateCharge);
  </script>
</body>
</html>
